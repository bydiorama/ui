name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Deliberately BEFORE install. Every check here is dependency-free Node,
      # so a cold clone can prove the repo is internally consistent without
      # trusting a lockfile or a network.
      - name: Manifest
        run: node scripts/validate-manifest.mjs

      - name: Registry freshness
        run: node scripts/build-registry.mjs --check

      - name: Change ledger
        run: node scripts/validate-ledger.mjs

      - name: Licensing
        run: node scripts/lint-licensing.mjs

      # Tests run on Node's built-in runner with type-stripping — also
      # dependency-free, so they belong in the pre-install block.
      - name: Tests
        run: node --experimental-strip-types --test "packages/*/src/**/*.test.ts"

      # Also dependency-free: it imports only the tokens package's own source.
      - name: Utilities resolve against the token theme
        run: node --experimental-strip-types scripts/check-utilities.mjs

      # ADR 0012: the behaviour layer stays swappable only while nothing
      # public depends on it. Listed here as its own step because this
      # workflow enumerates the checks rather than running `pnpm verify` —
      # adding a gate to `verify` alone would leave it unrun in CI.
      - name: Behaviour-layer boundaries
        run: node scripts/check-boundaries.mjs

      # The skill contract, plus freshness of the generated .claude/skills
      # copies. A skill loads on its description alone, so a bad one fails
      # silently — which is exactly what a gate is for (ADR 0013).
      - name: Skill contract
        run: node scripts/validate-skills.mjs && node scripts/build-skills.mjs --check

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      # Interaction contracts run in a real browser (CONVENTIONS §10): implicit
      # activation and computed cursor are UA behaviours jsdom cannot answer.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Two projects: `contract` (computed-style + keyboard assertions) and
      # `stories` (every story run through axe at error severity).
      - name: Browser tests — contracts and story a11y
        run: pnpm run test:browser

      # Compiles every story. NOTE: a build does not run axe — story
      # accessibility is enforced by the `stories` vitest project above, which
      # runs each story with addon-a11y at error severity.
      - name: Storybook build
        run: pnpm --filter @bydiorama/storybook run build
