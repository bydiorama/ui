name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Deliberately BEFORE install. Every check here is dependency-free Node,
      # so a cold clone can prove the repo is internally consistent without
      # trusting a lockfile or a network.
      - name: Manifest
        run: node scripts/validate-manifest.mjs

      - name: Registry freshness
        run: node scripts/build-registry.mjs --check

      # The registry ships SOURCE, so an undeclared import is a build error in
      # somebody else's app. `cn` declared clsx and tailwind-merge from the
      # start, so the mechanism was understood — seven Base UI components just
      # never got the same treatment, and `peerDependencies` (which the shadcn
      # schema has no field for, and which was never emitted) made it look
      # handled.
      - name: Registry items declare what they import
        run: node scripts/check-dependencies.mjs

      - name: Change ledger
        run: node scripts/validate-ledger.mjs

      - name: Licensing
        run: node scripts/lint-licensing.mjs

      # Tests run on Node's built-in runner with type-stripping — also
      # dependency-free, so they belong in the pre-install block.
      - name: Tests
        run: node --experimental-strip-types --test "packages/*/src/**/*.test.ts" "registry/**/*.test.ts"

      # Also dependency-free: it imports only the tokens package's own source.
      - name: Utilities resolve against the token theme
        run: node --experimental-strip-types scripts/check-utilities.mjs

      # ADR 0012: the behaviour layer stays swappable only while nothing
      # public depends on it. Listed here as its own step because this
      # workflow enumerates the checks rather than running `pnpm verify` —
      # adding a gate to `verify` alone would leave it unrun in CI.
      - name: Behaviour-layer boundaries
        run: node scripts/check-boundaries.mjs

      # Contrast figures are DECLARED as pairs and measured here — never typed
      # by hand. Three fabricated numbers shipped before this gate existed.
      # A bespoke control is invisible to every other gate: its classes
      # resolve, it declares its own contrast pairs, and it has no props to
      # get wrong. Four components reinvented the same 32px chrome control
      # before anyone noticed.
      - name: Controls come from the library
        run: node scripts/check-controls.mjs

      # Base UI flips and shifts an anchored panel by default, so this looks
      # handled at a comfortable window size. It cannot SHRINK a panel that is
      # bigger than its space, and every panel here carried a flat 256px cap
      # that knew nothing about the viewport.
      - name: Anchored panels stay in the viewport
        run: node scripts/check-overlays.mjs

      # Reports, never fails. A design gap is a question for a person, and a
      # gate that blocked on one would teach people to stop declaring them.
      # Two components asking for the same thing is the signal — invisible
      # while these lived as prose in separate knownGaps lists.
      # The visual job records baselines with the Chromium inside its
      # container and compares against the same. Bump `playwright` without
      # bumping the image tag and every case diffs at once — a RED run that
      # looks like the gate working while it measures the wrong browser.
      - name: Visual runner matches Playwright
        run: node scripts/check-visual-runner.mjs

      - name: Design gaps
        run: node scripts/report-design-gaps.mjs

      - name: Contrast pairs
        run: node scripts/check-contrast.mjs --check

      # The skill contract, plus freshness of the generated .claude/skills
      # copies. A skill loads on its description alone, so a bad one fails
      # silently — which is exactly what a gate is for (ADR 0013).
      - name: Skill contract
        run: node scripts/validate-skills.mjs && node scripts/build-skills.mjs --check

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      # Interaction contracts run in a real browser (CONVENTIONS §10): implicit
      # activation and computed cursor are UA behaviours jsdom cannot answer.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Two projects: `contract` (computed-style + keyboard assertions) and
      # `stories` (every story run through axe at error severity).
      - name: Browser tests — contracts and story a11y
        run: pnpm run test:browser

      # Compiles every story. NOTE: a build does not run axe — story
      # accessibility is enforced by the `stories` vitest project above, which
      # runs each story with addon-a11y at error severity.
      - name: Storybook build
        run: pnpm --filter @bydiorama/storybook run build

  # Visual regression, in a CONTAINER rather than on the runner image.
  #
  # Baselines are platform-specific by construction: font rasterisation
  # differs between macOS and Linux, so `-chromium-darwin` PNGs cannot pass
  # here and vitest writes a separate `-chromium-linux` set. The container is
  # what makes that second set reproducible — `ubuntu-latest` moves under us
  # (a font package bump is enough to shift a glyph by a pixel), and the
  # comparator sits at allowedMismatchedPixels: 0, where one pixel is a
  # failure. The image pins the Chromium build AND the font set together.
  #
  # The tag is the exact Playwright version this repo resolves to. It must be
  # bumped WITH the dependency: a mismatch between the driver in the lockfile
  # and the browser in the image is the one thing this job cannot detect, and
  # it would look like a library-wide visual change.
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      # The image ships a non-root `pwuser`, but actions/checkout and the
      # pnpm store both write into the workspace, so the job runs as root to
      # avoid a permissions fight that shows up as an unrelated install error.
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fails with an instruction rather than 30 confusing "no reference
      # screenshot found" errors. A first run on a new platform CREATES
      # baselines and reports failure, which reads as a regression when it is
      # actually an empty set — see the generate-visual-baselines workflow.
      - name: Linux baselines must exist
        run: |
          count=$(find registry/visual/__screenshots__ -name '*-chromium-linux.png' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::No -chromium-linux baselines are committed, so there is nothing to compare against."
            echo "Run the 'Generate visual baselines' workflow, download its artifact, and commit the PNGs."
            exit 1
          fi
          echo "$count Linux baseline(s) present."

      - name: Visual regression
        run: pnpm run test:visual

      # The diff images are the whole point when this fails — without them a
      # red run says "pixels differ" and nothing else.
      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            apps/storybook/.vitest-attachments/**
            registry/visual/__screenshots__/**
          if-no-files-found: ignore
          retention-days: 14
