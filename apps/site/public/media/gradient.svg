<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <!-- A placeholder picture for the media components: theme zero's accent
       (#9EDBF3) rising out of a warm paper ground. An image, so its colours
       are fixed; the CSS-drawn placeholders follow the theme instead. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1ECE6" />
      <stop offset="0.55" stop-color="#C4E3EF" />
      <stop offset="1" stop-color="#9EDBF3" />
    </linearGradient>
  </defs>
  <rect width="1600" height="1200" fill="url(#g)" />
</svg>
